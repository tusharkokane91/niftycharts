<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nifty 50 | TradingView Terminal</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-blue: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .dashboard-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ticker-badge {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .metrics-bar {
      display: flex;
      gap: 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .pill strong {
      color: var(--accent-blue);
    }

    .chart-wrapper {
      position: relative;
      flex: 1;
      min-height: calc(100vh - 120px);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }

    .tradingview-widget-container {
      height: 100%;
      width: 100%;
    }

    .tradingview-widget-container__widget {
      height: 100%;
      width: 100%;
    }

    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      .chart-wrapper {
        min-height: 82vh;
      }
      .brand-title {
        font-size: 1rem;
      }
      .metrics-bar {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <header>
      <div class="brand-section">
        <span class="ticker-badge">NSE:NIFTY</span>
        <span class="brand-title">Nifty 50 Index Terminal</span>
      </div>
      <div class="metrics-bar">
        <span class="pill">Timeframe: <strong>1 Day (D)</strong></span>
        <span class="pill">Setup: <strong>MACD (3, 5, 5)</strong></span>
      </div>
    </header>

    <div class="chart-wrapper">
      <!-- TradingView Widget BEGIN -->
      <div class="tradingview-widget-container" id="tradingview_chart_container">
        <div class="tradingview-widget-container__widget" id="tradingview_widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "NSE:NIFTY",
            "interval": "D",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1", // 1 = Candlesticks
            "locale": "en",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "save_image": true,
            "container_id": "tradingview_widget",
            "studies": [
              "MACD@tv-basicstudies"
            ],
            "overrides": {
              "mainSeriesProperties.candleStyle.upColor": "#22c55e",
              "mainSeriesProperties.candleStyle.downColor": "#ef4444",
              "mainSeriesProperties.candleStyle.borderUpColor": "#22c55e",
              "mainSeriesProperties.candleStyle.borderDownColor": "#ef4444",
              "mainSeriesProperties.candleStyle.wickUpColor": "#22c55e",
              "mainSeriesProperties.candleStyle.wickDownColor": "#ef4444"
            },
            "studies_overrides": {
              "macd.fastLength": 3,
              "macd.slowLength": 5,
              "macd.signalLength": 5
            }
          });
        </script>
      </div>
      <!-- TradingView Widget END -->
    </div>
  </div>

</body>
</html>
